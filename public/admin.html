<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'atelier de NORA - Espace Administrateur</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2">
    
    <style>
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin-top: 15px; }
        .calendar-day { background: white; border: 2px solid #eaeaea; padding: 10px; border-radius: 8px; text-align: center; min-height: 80px; transition: all 0.3s ease; }
        .calendar-day.has-order { border-color: var(--gold-accent); background-color: #fdfcf8; }
        .calendar-day.empty { background-color: transparent; border: none; }
        .date-jour { font-size: 0.95rem; text-transform: capitalize; margin-bottom: 8px; }
        .pastille-cmd { background-color: var(--pine-green); color: white; padding: 5px 8px; border-radius: 5px; font-size: 0.85rem; display: block; margin-bottom: 5px; cursor: pointer; transition: 0.2s; }
        .pastille-cmd:hover { background-color: var(--gold-accent); }
        .btn-nav-cal { background: var(--gold-accent); color: white; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .highlight-focus { animation: flashHighlight 2s ease-out; }
        @keyframes flashHighlight { 0% { box-shadow: 0 0 20px var(--gold-accent); } 100% { box-shadow: none; } }

        @media (max-width: 768px) {
            .calendar-grid { display: flex; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 10px; }
            .calendar-day { flex: 0 0 120px; }
            .calendar-day.empty { display: none; }
        }
    </style>
</head>
<body class="admin-bg">

    <header class="header-fin">
        <a href="index.html" class="logo-titre">
            <span class="script">L'atelier De</span> <span class="serif">NORA</span>
            <span style="color: #e74c3c; font-size: 1rem; margin-left: 15px; font-family: sans-serif; font-weight:bold;">(ESPACE ADMIN)</span>
        </a>
        <nav style="display: flex; align-items: center;">
            <a href="index.html">Retour au site</a>
            <a href="#" onclick="seDeconnecter()" style="color: #e74c3c;">🚪 Déconnexion</a>
        </nav>
    </header>

    <main class="admin-dashboard">
        <div class="admin-stats" id="admin-stats"></div>

        <div class="admin-section">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 15px; flex-wrap: wrap; gap: 15px;">
                <h2 style="border: none; padding: 0; margin: 0;">📅 Calendrier des Commandes</h2>
                <div>
                    <button class="btn-nav-cal" onclick="changerMois(-1)">◀ Mois Préc.</button>
                    <span id="titre-mois" style="font-weight: bold; font-size: 1.2rem; color: var(--pine-green); margin: 0 15px; display: inline-block; min-width: 130px; text-align: center; text-transform: capitalize;"></span>
                    <button class="btn-nav-cal" onclick="changerMois(1)">Mois Suiv. ▶</button>
                </div>
            </div>
            <div id="admin-calendar" class="calendar-grid"></div>
        </div>

        <div class="admin-section">
            <h2>📦 Gestion des Commandes</h2>
            <div id="admin-orders"></div>
        </div>
    </main>

    <script src="script.js"></script>
    
    <script>
        let dateAffichage = new Date();

        async function rafraichirAdmin() {
            const res = await fetch('/api/commandes');
            commandes = await res.json();
            genererStats();
            genererCalendrier();
            genererListeCommandes();
        }

        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(rafraichirAdmin, 500); 
        });

        function genererStats() {
            let caTotal = 0; let aPreparer = 0;
            commandes.forEach(c => { caTotal += (c.total || 0); if(c.statut !== 'prete') aPreparer++; });
            document.getElementById('admin-stats').innerHTML = `
                <div class="stat-card"><h3>Total Commandes</h3><div class="value">${commandes.length}</div></div>
                <div class="stat-card"><h3>À Préparer</h3><div class="value" style="color: var(--status-orange)">${aPreparer}</div></div>
                <div class="stat-card"><h3>Chiffre d'Affaires</h3><div class="value" style="color: var(--status-vert)">${caTotal.toFixed(2)}€</div></div>
            `;
        }

        function changerMois(direction) { dateAffichage.setMonth(dateAffichage.getMonth() + direction); genererCalendrier(); }

        function scrollToCommande(idCmd) {
            const carte = document.getElementById('cmd-' + idCmd);
            if(carte) {
                carte.scrollIntoView({ behavior: 'smooth', block: 'center' });
                carte.classList.add('highlight-focus');
                setTimeout(() => carte.classList.remove('highlight-focus'), 2000);
            }
        }

        function genererCalendrier() {
            const calContainer = document.getElementById('admin-calendar');
            let annee = dateAffichage.getFullYear(); let mois = dateAffichage.getMonth();
            document.getElementById('titre-mois').innerText = dateAffichage.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });

            let premierJourMois = new Date(annee, mois, 1);
            let dernierJourMois = new Date(annee, mois + 1, 0);
            let nbJours = dernierJourMois.getDate();
            let jourSemaine = premierJourMois.getDay() === 0 ? 6 : premierJourMois.getDay() - 1;

            let calHTML = '';
            for(let i = 0; i < jourSemaine; i++) { calHTML += `<div class="calendar-day empty"></div>`; }

            for(let jour = 1; jour <= nbJours; jour++) {
                let dateStr = `${annee}-${String(mois + 1).padStart(2, '0')}-${String(jour).padStart(2, '0')}`;
                let cmdsDuJour = commandes.filter(c => c.date === dateStr);
                let nomJour = new Date(annee, mois, jour).toLocaleDateString('fr-FR', {weekday: 'short', day: 'numeric'});
                let pastillesHTML = cmdsDuJour.map(cmd => `<div class="pastille-cmd" onclick="scrollToCommande('${cmd.id}')">📦 ${cmd.nom.split(' ')[0]}</div>`).join('') || '-';
                calHTML += `<div class="calendar-day ${cmdsDuJour.length > 0 ? 'has-order' : ''}"><div class="date-jour">${nomJour}</div><div>${pastillesHTML}</div></div>`;
            }
            calContainer.innerHTML = calHTML;
        }

        function supprimerCommandeAdmin(id) {
            if(confirm("⚠️ Supprimer ?")) {
                fetch(`/api/commandes/${id}`, { method: 'DELETE' }).then(() => rafraichirAdmin());
            }
        }

        function genererListeCommandes() {
            const ordersContainer = document.getElementById('admin-orders');
            if(commandes.length === 0) { ordersContainer.innerHTML = "<p>Vide.</p>"; return; }
            let triees = [...commandes].sort((a,b) => new Date(a.date) - new Date(b.date));
            ordersContainer.innerHTML = triees.map(cmd => {
                let badge = cmd.statut === 'recu' ? 'statut-rouge' : (cmd.statut === 'preparation' ? 'statut-orange' : 'statut-vert');
                return `
                <div class="order-card" id="cmd-${cmd.id}">
                    <div class="order-info">
                        <h4>Commande ${cmd.id} <span class="order-badge ${badge}">${cmd.statut.toUpperCase()}</span></h4>
                        <p>👤 <b>${cmd.nom}</b></p>
                        <p>📅 <b>Le :</b> ${new Date(cmd.date).toLocaleDateString('fr-FR')}</p>
                        <p>🛒 <b>Articles :</b> ${cmd.articles.map(a => `${a.quantite}x ${a.nom}`).join(', ')}</p>
                    </div>
                    <div style="width: 200px;">
                        <select class="select-statut" onchange="changerStatut('${cmd.id}', this.value)">
                            <option value="recu" ${cmd.statut === 'recu' ? 'selected' : ''}>🔴 Reçue</option>
                            <option value="preparation" ${cmd.statut === 'preparation' ? 'selected' : ''}>🟠 Préparation</option>
                            <option value="prete" ${cmd.statut === 'prete' ? 'selected' : ''}>🟢 Prête</option>
                        </select>
                        <button onclick="supprimerCommandeAdmin('${cmd.id}')" class="btn-terminer" style="background:#e74c3c; margin-top:5px;">Effacer</button>
                    </div>
                </div>`;
            }).join('');
        }
    </script>
</body>
</html>
