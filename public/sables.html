<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sablés Maison - L'atelier De NORA</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <header class="header-fin">
    <a href="index.html" class="logo-titre"><span class="script">L'atelier De</span> <span class="serif">NORA</span></a>
    <nav style="display: flex; align-items: center;">
      <a href="index.html">Accueil</a>
      <a href="catalogue.html">Nos Douceurs</a>
      <a href="nos-prestations.html">Nos Prestations</a>
      <a href="qui-sommes-nous.html">Qui sommes-nous ?</a>
      <a href="panier.html">Mon Panier</a>
      <span id="menu-auth-dynamique"></span>
    </nav>
  </header>

  <main>
    <section class="page-produit">
      <img src="images/sable-confiture.jpg" alt="Sablés Maison" class="image-principale" id="image-sable">
      <div class="details">
        <h2>Sablés Maison</h2>
        <p class="prix-gros">1,50 € l'unité</p>
        
        <div style="margin: 20px 0; padding-bottom: 15px; border-bottom: 1px solid #eee;">
            <label style="display: block; margin-bottom: 8px; font-weight: bold; color: var(--pine-green);">Parfum au choix :</label>
            <select id="choix-sable" style="width: 100%; padding: 12px; border-radius: 6px; border: 2px solid #ddd; font-family: inherit; font-size: 1rem;" onchange="mettreAJourSable(this.value)">
                <option value="Confiture">Confiture</option>
                <option value="Nutella">Nutella</option>
                <option value="Vanille">Vanille</option>
                <option value="Sucre Glace">Sucre Glace</option>
            </select>
        </div>

        <p><strong>Ingrédients :</strong> Farine, beurre frais, œufs, sucre, garniture au choix.</p>
        
        <div class="action-produit">
            <div class="selecteur-qte">
                <button class="btn-qte" onclick="modifierQuantiteProduit(-1)">-</button>
                <input type="number" id="qte-produit" class="input-qte" value="1" min="1" readonly>
                <button class="btn-qte" onclick="modifierQuantiteProduit(1)">+</button>
            </div>
            <button onclick="ajouterSableCible()" class="bouton">🛒 Ajouter</button>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
  <script>
      const imagesSables = {
          "Confiture": "images/sable-confiture.jpg",
          "Nutella": "images/sable-nutella.jpg",
          "Vanille": "images/sable-vanille.jpg",
          "Sucre Glace": "images/sable-sucre-glace.jpg"
      };

      function mettreAJourSable(type) {
          document.getElementById('image-sable').src = imagesSables[type];
      }

      function ajouterSableCible() {
          const type = document.getElementById('choix-sable').value;
          const qte = parseInt(document.getElementById('qte-produit').value);
          ajouterAuPanier("Sablé " + type, 1.50, imagesSables[type], qte);
      }
  </script>
</body>
</html>
