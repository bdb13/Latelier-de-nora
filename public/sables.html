<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sablés - L'atelier De NORA</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <header class="header-fin">
    <a href="index.html" class="logo-titre"><span class="script">L'atelier De</span> <span class="serif">NORA</span></a>
    <nav style="display: flex; align-items: center;">
      <a href="index.html">Accueil</a>
      <a href="catalogue.html">Nos Douceurs</a>
      <a href="nos-prestations.html">Nos Prestations</a>
      <a href="qui-sommes-nous.html">Qui sommes-nous ?</a>
      <a href="panier.html">Mon Panier</a>
      <span id="menu-auth-dynamique"></span>
    </nav>
  </header>

  <main>
    <section class="page-produit">
      <img src="images/sables.jpg" alt="Sablés" class="image-principale" id="image-sable">
      <div class="details">
        <h2>Sablés Maison</h2>
        <p class="prix-gros">1,50 € l'unité</p>
        
        <div style="background: #fdfcf8; padding: 20px; border-radius: 10px; border: 1px solid var(--gold-accent); margin: 20px 0;">
            <label style="display: block; margin-bottom: 10px; font-weight: bold; color: var(--pine-green);">Choisissez votre modèle :</label>
            <select id="choix-sable" style="width: 100%; padding: 12px; border-radius: 5px; border: 2px solid #ddd; font-size: 1rem;" onchange="changerImageSable(this.value)">
                <option value="Sablés Classiques (Confiture)">Sablés Lunettes (Confiture & Sucre Glace)</option>
                <option value="Sablés de Fête (Perles)">Sablés de Fête (Perles Multicolores)</option>
                <option value="Sablés Chocolat">Sablés au Chocolat</option>
            </select>
        </div>

        <p><strong>Ingrédients :</strong> Farine, beurre, œuf, vanille, sucre glace, confiture ou perles de sucre.</p>
        <div class="produit-argument">✨ Nos sablés sont fondants et préparés avec amour. Choisissez le modèle qui vous fait envie !</div>
        
        <div class="action-produit">
            <div class="selecteur-qte">
                <button class="btn-qte" onclick="modifierQuantiteProduit(-1)">-</button>
                <input type="number" id="qte-produit" class="input-qte" value="1" min="1" readonly>
                <button class="btn-qte" onclick="modifierQuantiteProduit(1)">+</button>
            </div>
            <button onclick="ajouterSableSelectionne()" class="bouton">🛒 Ajouter au panier</button>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
  <script>
    function changerImageSable(valeur) {
        const img = document.getElementById('image-sable');
        if (valeur === "Sablés de Fête (Perles)") {
            img.src = "images/1000000827.jpg"; // Photo avec les perles
        } else {
            img.src = "images/sables.jpg"; // Photo lunettes classique
        }
    }

    function ajouterSableSelectionne() {
        const nomComplet = document.getElementById('choix-sable').value;
        const quantite = parseInt(document.getElementById('qte-produit').value);
        const image = document.getElementById('image-sable').src;
        
        // On utilise directement la fonction de script.js
        ajouterAuPanier(nomComplet, 1.50, image, quantite);
    }
  </script>
</body>
</html>
