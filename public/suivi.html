<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suivre ma commande - L'atelier De NORA</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body class="catalogue-bg">
  
  <header class="header-fin">
    <a href="index.html" class="logo-titre">
      <span class="script">L'atelier De</span> <span class="serif">NORA</span>
    </a>
    <nav style="display: flex; align-items: center;">
      <a href="index.html">Accueil</a>
      <a href="catalogue.html">Nos Douceurs</a>
      <a href="nos-prestations.html">Nos Prestations</a>
      <a href="qui-sommes-nous.html">Qui sommes-nous ?</a>
      <a href="panier.html">Mon Panier</a>
      <span id="menu-auth-dynamique"></span>
    </nav>
  </header>

  <main style="padding: 20px;">
    <section class="formulaire-commande" style="max-width: 600px; margin: 50px auto;">
      <h2>Où en sont mes douceurs ? 🔍</h2>
      <p style="margin-bottom: 30px; text-align: center;">Entrez votre numéro de commande (ex: NORA-12345) ou votre téléphone.</p>
      
      <form id="form-suivi">
        <div class="groupe-champ">
          <input type="text" id="numero-suivi" placeholder="NORA-12345 ou 0612345678" required style="text-align: center; font-size: 1.2rem;">
        </div>
        <button type="submit" class="bouton" style="width: 100%;">Vérifier le statut</button>
      </form>

      <div id="resultat-suivi"></div>
    </section>
  </main>

  <script src="script.js"></script>

  <script>
    document.getElementById('form-suivi').addEventListener('submit', (e) => {
        e.preventDefault();
        const recherche = document.getElementById('numero-suivi').value.trim().toUpperCase();
        const conteneur = document.getElementById('resultat-suivi');

        // On cherche dans l'array 'commandes' qui vient d'être rempli par MongoDB via script.js
        const trouvees = commandes.filter(c => 
            (c.id && c.id.toUpperCase() === recherche) || 
            (c.tel && c.tel.replace(/\s/g, '') === recherche.replace(/\s/g, ''))
        );

        if (trouvees.length === 0) {
            conteneur.innerHTML = `<p style="color:red; text-align:center; margin-top:20px; font-weight:bold;">❌ Aucune commande trouvée. Vérifiez l'identifiant.</p>`;
        } else {
            let html = '<div style="margin-top: 30px;">';
            trouvees.forEach(cmd => {
                let badge = cmd.statut === 'recu' ? 'statut-rouge' : (cmd.statut === 'preparation' ? 'statut-orange' : 'statut-vert');
                let texte = cmd.statut === 'recu' ? 'Reçue' : (cmd.statut === 'preparation' ? 'En préparation' : 'Prête !');
                
                let modeIcon = cmd.methode === 'livraison' ? '🚚 Livraison' : (cmd.methode === 'maison' ? '🏠 Retrait chez Nora' : '🛍️ Retrait au Stand');
                let heureText = cmd.methode === 'stand' ? 'Matin (9h-12h)' : (cmd.heure || 'Non précisée');

                html += `
                <div style="background: white; border: 2px solid var(--gold-accent); padding: 20px; border-radius: 12px; margin-bottom: 15px;">
                    <h3 style="color: var(--gold-accent); border-bottom: 1px solid #eee; padding-bottom:10px; margin-top:0;">Commande ${cmd.id}</h3>
                    <p><b>Statut :</b> <span class="order-badge ${badge}">${texte}</span></p>
                    <p>📅 <b>Prévue le :</b> <span style="color:var(--pine-green); font-weight:bold;">${new Date(cmd.date).toLocaleDateString('fr-FR')} à ${heureText}</span></p>
                    <p>📦 <b>Mode :</b> ${modeIcon}</p>
                    <p>🛒 <b>Articles :</b> ${cmd.articles.map(a => `${a.quantite}x ${a.nom}`).join(', ')}</p>
                </div>`;
            });
            conteneur.innerHTML = html + '</div>';
        }
    });
  </script>
</body>
</html>
