<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suivre ma commande - L'atelier De NORA</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body class="catalogue-bg">
  
  <header class="header-fin">
    <a href="index.html" class="logo-titre">
      <span class="script">L'atelier De</span> <span class="serif">NORA</span>
    </a>
    <nav style="display: flex; align-items: center;">
      <a href="index.html">Accueil</a>
      <a href="catalogue.html">Nos Douceurs</a>
      <a href="panier.html">Mon Panier</a>
      <span id="menu-auth-dynamique"></span>
    </nav>
  </header>

  <main style="padding: 20px;">
    <section class="formulaire-commande" style="max-width: 600px; margin: 50px auto;">
      <h2>Où en sont mes douceurs ? 🔍</h2>
      <p style="margin-bottom: 30px; text-align: center;">Entrez votre numéro de commande (ex: NORA-12345) ou votre numéro de téléphone pour vérifier le statut de votre réservation.</p>
      
      <form id="form-suivi">
        <div class="groupe-champ">
          <input type="text" id="numero-suivi" placeholder="NORA-12345 ou 0612345678" required style="text-align: center; font-size: 1.2rem;">
        </div>
        <button type="submit" class="bouton" style="width: 100%;">Vérifier le statut</button>
      </form>

      <div id="resultat-suivi"></div>
    </section>
  </main>

  <script src="script.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
        const formSuivi = document.getElementById('form-suivi');
        const conteneurResultat = document.getElementById('resultat-suivi');

        if (formSuivi) {
            formSuivi.addEventListener('submit', (e) => {
                e.preventDefault();
                const recherche = document.getElementById('numero-suivi').value.trim().toUpperCase();
                
                // Recherche par ID de commande OU par téléphone (en enlevant les espaces)
                const commandesTrouvees = commandes.filter(c => 
                    (c.id && c.id.toUpperCase() === recherche) || 
                    (c.tel && c.tel.replace(/\s/g, '') === recherche.replace(/\s/g, ''))
                );

                if (commandesTrouvees.length === 0) {
                    conteneurResultat.innerHTML = `<div style="margin-top: 30px; text-align: center; color: #e74c3c; font-weight: bold; background: #fdfcf8; padding: 15px; border-radius: 8px; border: 1px solid #e74c3c;">
                        ❌ Aucune commande trouvée avec cet identifiant.
                    </div>`;
                } else {
                    let html = '<div style="margin-top: 30px;">';
                    commandesTrouvees.forEach(cmd => {
                        let badgeClass = cmd.statut === 'recu' ? 'statut-rouge' : (cmd.statut === 'preparation' ? 'statut-orange' : 'statut-vert');
                        let statutTexte = cmd.statut === 'recu' ? 'Reçue (En attente)' : (cmd.statut === 'preparation' ? 'En préparation' : 'Prête / Livrée');
                        
                        html += `
                        <div style="background: white; border: 2px solid var(--gold-accent); padding: 25px; border-radius: 12px; margin-bottom: 20px; text-align: left; box-shadow: 0 5px 15px rgba(0,0,0,0.05);">
                            <h3 style="margin-top: 0; color: var(--gold-accent); border-bottom: 1px solid #eee; padding-bottom: 10px;">Commande ${cmd.id}</h3>
                            <p style="font-size: 1.1rem; margin-bottom: 15px; color: var(--pine-green); font-weight: bold;">Statut : <span class="order-badge ${badgeClass}" style="font-size: 1rem;">${statutTexte}</span></p>
                            <p>📅 <b>Prévue pour le :</b> ${new Date(cmd.date).toLocaleDateString('fr-FR')}</p>
                            <p>📦 <b>Mode :</b> ${cmd.methode === 'livraison' ? '🚚 Livraison' : '🛍️ Retrait Stand'}</p>
                            <p style="margin-bottom: 0;">🛒 <b>Total :</b> ${cmd.total.toFixed(2)} €</p>
                        </div>`;
                    });
                    html += '</div>';
                    conteneurResultat.innerHTML = html;
                }
            });
        }
    });
  </script>
</body>
</html>
