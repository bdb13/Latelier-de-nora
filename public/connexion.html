<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion - L'atelier De NORA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="catalogue-bg">
  
  <header class="header-fin">
    <a href="index.html" class="logo-titre">
      <span class="script">L'atelier De</span> <span class="serif">NORA</span>
    </a>
    <nav style="display: flex; align-items: center;">
      <a href="index.html">Accueil</a>
      <a href="catalogue.html">Nos Douceurs</a>
      <a href="panier.html">Mon Panier</a>
      <span id="menu-auth-dynamique"></span>
    </nav>
  </header>

  <main>
    <section id="bloc-connexion" class="connexion-container">
      <h2 style="font-family: 'Playfair Display', serif; color: var(--pine-green);">Content de vous revoir !</h2>
      
      <button class="btn-social google" onclick="alerteSociale('Google')">Continuer avec Google (Bientôt)</button>
      <button class="btn-social facebook" onclick="alerteSociale('Facebook')">Continuer avec Facebook (Bientôt)</button>
      
      <div class="separateur">OU</div>

      <form id="form-connexion">
        <div class="groupe-champ">
          <input type="email" id="email-connexion" placeholder="Votre adresse email" required>
        </div>
        <div class="groupe-champ">
          <input type="password" id="mdp-connexion" placeholder="Mot de passe" required>
        </div>
        <button type="submit" class="bouton" style="width: 100%;">Se connecter</button>
      </form>

      <p style="margin-top: 20px;">Pas encore de compte ? <a href="#" onclick="switchForm(true)" style="color: var(--gold-accent); font-weight: bold;">S'inscrire</a></p>
    </section>

    <section id="bloc-inscription" class="connexion-container" style="display: none;">
      <h2 style="font-family: 'Playfair Display', serif; color: var(--pine-green);">Créer un compte</h2>
      
      <form id="form-inscription">
        <div class="groupe-champ">
          <input type="text" id="nom-inscr" placeholder="Nom et Prénom" required>
        </div>
        <div class="groupe-champ">
          <input type="tel" id="tel-inscr" placeholder="Numéro de téléphone (ex: 0612345678)" required>
        </div>
        <div class="groupe-champ">
          <input type="email" id="email-inscr" placeholder="Adresse email" required>
        </div>
        <div class="groupe-champ">
          <input type="password" id="mdp-inscr" placeholder="Mot de passe" required>
        </div>
        <button type="submit" class="bouton" style="width: 100%;">S'inscrire</button>
      </form>

      <p style="margin-top: 20px;">Déjà membre ? <a href="#" onclick="switchForm(false)" style="color: var(--gold-accent); font-weight: bold;">Se connecter</a></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
